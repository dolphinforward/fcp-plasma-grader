name: Hosted Intel release build

on:
  workflow_dispatch:
    inputs:
      xcode_app:
        description: Preinstalled Xcode application on macos-15-intel
        required: true
        default: /Applications/Xcode_16.4.app
        type: string

permissions:
  contents: read

jobs:
  build:
    # The repository is public. Only the owner may pass the temporary read-only
    # deploy key that can clone the private SDK input repository.
    if: github.actor == github.repository_owner
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      PRIVATE_ASSET_DEPLOY_KEY: ${{ secrets.PRIVATE_ASSET_DEPLOY_KEY }}
      XCODE_APP: ${{ inputs.xcode_app }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify hosted build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test -d "$XCODE_APP/Contents/Developer"
          if test -z "$PRIVATE_ASSET_DEPLOY_KEY"; then
            echo "::error::Temporary repository secret PRIVATE_ASSET_DEPLOY_KEY is missing."
            exit 1
          fi
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          xcodebuild -version
          python3 tools/verify_project.py

      - name: Retrieve and install private Apple FxPlug SDK input
        shell: bash
        run: |
          set -euo pipefail
          asset_checkout="$RUNNER_TEMP/private-build-assets"
          key_path="$RUNNER_TEMP/private-build-assets-key"
          /usr/bin/install -m 600 /dev/null "$key_path"
          printf '%s\n' "$PRIVATE_ASSET_DEPLOY_KEY" > "$key_path"
          cleanup_key() {
            /bin/rm -f "$key_path"
          }
          trap cleanup_key EXIT
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 \
              git@github.com:dolphinforward/fcp-plasma-grader-build-assets.git \
              "$asset_checkout"
          cleanup_key
          trap - EXIT

          (cd "$asset_checkout" && shasum -a 256 --check SHA256SUMS.txt)
          sdk_dmg="$RUNNER_TEMP/FxPlug_SDK_4.3.4.dmg"
          /bin/cp "$asset_checkout/FxPlug_SDK_4.3.4.dmg" "$sdk_dmg"
          test "$(shasum -a 256 "$sdk_dmg" | awk '{print $1}')" = \
            "47f43137cf7ddff275b22c9f41a0545258ca574f77f9fbce9b40e8055b1c565b"
          hdiutil verify "$sdk_dmg"

          mount_point="$RUNNER_TEMP/FxPlugSDKMount"
          mkdir -p "$mount_point"
          hdiutil attach "$sdk_dmg" -nobrowse -readonly -mountpoint "$mount_point"
          cleanup_mount() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT

          sdk_pkg="$(find "$mount_point" -maxdepth 3 -name 'FxPlugSDK.pkg' -print -quit)"
          test -n "$sdk_pkg"
          pkgutil --check-signature "$sdk_pkg"
          sudo installer -pkg "$sdk_pkg" -target /
          cleanup_mount
          trap - EXIT

          test -d /Library/Developer/SDKs/FxPlug.sdk
          runtime_root=/Library/Developer/Frameworks
          test -d "$runtime_root/FxPlug.framework"
          test -d "$runtime_root/PluginManager.framework"
          codesign --verify --deep --strict "$runtime_root/FxPlug.framework"
          codesign --verify --deep --strict "$runtime_root/PluginManager.framework"

          runtime_minos() {
            otool -l "$1" | awk '
              $1 == "cmd" && $2 == "LC_BUILD_VERSION" { build = 1; next }
              build && $1 == "minos" { print $2; exit }
            '
          }
          test "$(runtime_minos "$runtime_root/FxPlug.framework/Versions/A/FxPlug")" = "13.0"
          test "$(runtime_minos "$runtime_root/PluginManager.framework/Versions/B/PluginManager")" = "13.0"

          # Patch only the ephemeral text-based link stubs. The signed macOS 13
          # runtime binaries above are never patched or placed in the release.
          sudo python3 tools/prepare_legacy_fxplug_sdk.py \
            --sdk /Library/Developer/SDKs/FxPlug.sdk \
            --target-minimum 11.0

      - name: Build x86_64 Monterey-compatible bundle
        id: build
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          derived="$RUNNER_TEMP/CSTGradeDerivedData-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          xcodebuild \
            -project CSTGrade.xcodeproj \
            -scheme CSTGrade \
            -configuration Release \
            -derivedDataPath "$derived" \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=11.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          echo "derived_data=$derived" >> "$GITHUB_OUTPUT"

      - name: Inspect and ad-hoc sign product
        id: product
        shell: bash
        run: |
          set -euo pipefail
          bundle="${{ steps.build.outputs.derived_data }}/Build/Products/Release/CSTGrade.fxplug"
          wrapper="$bundle/Contents/MacOS/CSTGrade"
          service_bundle="$bundle/Contents/PlugIns/CSTGradeXPC.pluginkit"
          service="$service_bundle/Contents/MacOS/CSTGradeXPC"
          test -d "$bundle"
          test -f "$wrapper"
          test -f "$service"
          test -f "$service_bundle/Contents/Resources/default.metallib"
          test "$(lipo -archs "$wrapper")" = "x86_64"
          test "$(lipo -archs "$service")" = "x86_64"
          test ! -e "$service_bundle/Contents/Frameworks/FxPlug.framework"
          test ! -e "$service_bundle/Contents/Frameworks/PluginManager.framework"
          otool -L "$service" | grep -F '@rpath/FxPlug.framework/Versions/A/FxPlug'
          otool -L "$service" | grep -F '@rpath/PluginManager.framework/Versions/B/PluginManager'

          codesign --force --sign - --timestamp=none "$service_bundle"
          codesign --force --sign - --timestamp=none "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          file "$wrapper" "$service"
          otool -l "$wrapper" | grep -A5 LC_BUILD_VERSION
          otool -l "$service" | grep -A5 LC_BUILD_VERSION
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Package plug-in, Motion-free template, and installer
        id: package
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/FCP Plasma Grader"
          artifact="$RUNNER_TEMP/FCPPlasmaGraderArtifact"
          mkdir -p "$release" "$artifact"
          ditto "${{ steps.product.outputs.bundle }}" "$release/CSTGrade.fxplug"
          ditto "Distribution/Motion Templates.localized" "$release/Motion Templates.localized"
          cp "Distribution/Install FCP Plasma Grader.command" "$release/"
          cp "Distribution/Uninstall FCP Plasma Grader.command" "$release/"
          cp Distribution/README-FIRST.txt THIRD_PARTY_NOTICES.md "$release/"
          chmod +x "$release/Install FCP Plasma Grader.command" "$release/Uninstall FCP Plasma Grader.command"
          ditto -c -k --sequesterRsrc --keepParent "$release" "$artifact/FCP-Plasma-Grader-x86_64.zip"
          (cd "$artifact" && shasum -a 256 FCP-Plasma-Grader-x86_64.zip > SHA256SUMS.txt)
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCP-Plasma-Grader-x86_64-${{ github.sha }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-build-log-${{ github.run_id }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
